<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Workspace</title>
    <style>
      :root {
        --bg-0: #0d111c;
        --bg-1: #141a28;
        --panel: #1b2233;
        --panel-hi: #232d44;
        --border: #2c3650;
        --border-hi: #4c7dff;
        --text: #eaeff9;
        --text-dim: #96a4c4;
        --text-faint: #5d6b8c;
        --accent: #4c7dff;
        --accent-2: #7aa2ff;
        --good: #5cc46a;
        --danger: #ff8a80;
        --radius: 14px;
        --radius-sm: 10px;
        --pill: 999px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --shadow-sm: 0 3px 12px rgba(0, 0, 0, 0.3);
        --font: "Inter Variable", "Inter", system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-1);
        overflow: hidden;
        font-family: var(--font);
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
      .icon {
        display: inline-block;
        vertical-align: -0.15em;
        flex: 0 0 auto;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .menu-card,
        .char-card {
          animation: none !important;
        }
      }

      /* --- Shared menu shell --- */
      .menu-screen {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        padding: 64px 24px 48px;
        text-align: center;
        background:
          radial-gradient(1100px 620px at 50% -8%, #223056 0%, rgba(34, 48, 86, 0) 60%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      }
      .menu-screen h1 {
        color: var(--text);
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      .menu-subheading {
        color: var(--text-dim);
        font-size: 15px;
        margin: 0 0 44px;
      }

      /* --- Name field (character select) --- */
      .name-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 0 0 30px;
      }
      .name-label {
        color: var(--text-dim);
        font-size: 14px;
      }
      .name-input {
        background: var(--panel);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        padding: 11px 14px;
        width: 240px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .name-input::placeholder {
        color: var(--text-faint);
      }
      .name-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(76, 125, 255, 0.22);
      }

      /* --- Map cards --- */
      .menu-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        max-width: 1000px;
        margin: 0 auto;
      }
      .menu-card {
        width: 230px;
        background: var(--panel);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        cursor: pointer;
        color: inherit;
        font: inherit;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        text-align: left;
        box-shadow: var(--shadow-sm);
        transition: transform 0.16s ease, border-color 0.16s, box-shadow 0.16s, background 0.16s;
        animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .menu-card:nth-child(2) { animation-delay: 0.05s; }
      .menu-card:nth-child(3) { animation-delay: 0.1s; }
      .menu-card:nth-child(4) { animation-delay: 0.15s; }
      .menu-card:hover {
        background: var(--panel-hi);
        border-color: var(--border-hi);
        transform: translateY(-4px);
        box-shadow: var(--shadow);
      }
      .menu-preview {
        width: 100%;
        height: 132px;
        object-fit: cover;
        image-rendering: pixelated;
        border-radius: var(--radius-sm);
        margin-bottom: 14px;
      }
      .menu-card-title {
        color: var(--text);
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .menu-card-desc {
        color: var(--text-dim);
        font-size: 12.5px;
        line-height: 1.45;
        margin-bottom: 14px;
        min-height: 36px;
      }
      .menu-card-cta {
        color: var(--accent-2);
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      /* --- HUD overlay --- */
      .hud-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .hud-chip {
        position: absolute;
        background: rgba(15, 19, 30, 0.82);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: var(--pill);
        color: var(--text);
        box-shadow: var(--shadow-sm);
      }
      .hud-title {
        top: 16px;
        left: 18px;
        font-size: 15px;
        font-weight: 700;
        padding: 8px 16px;
      }
      .hud-hint {
        bottom: 16px;
        left: 18px;
        font-size: 12.5px;
        color: var(--text-dim);
        padding: 8px 15px;
      }
      .hud-exit {
        position: absolute;
        top: 14px;
        right: 18px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
        background: rgba(15, 19, 30, 0.82);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 138, 128, 0.35);
        border-radius: var(--pill);
        color: var(--danger);
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        padding: 9px 18px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .hud-exit:hover {
        background: rgba(255, 138, 128, 0.16);
        border-color: var(--danger);
      }

      /* --- Presence roster (#29) --- */
      .presence {
        position: absolute;
        top: 62px;
        right: 18px;
        width: 194px;
        max-height: 44vh;
        display: flex;
        flex-direction: column;
        z-index: 11;
        pointer-events: auto;
        background: rgba(15, 19, 30, 0.82);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        color: var(--text);
        overflow: hidden;
      }
      .presence-header {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 13px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .presence-count {
        margin-left: auto;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        border-radius: var(--pill);
        padding: 1px 8px;
        font-size: 11px;
      }
      .presence-list {
        list-style: none;
        margin: 0;
        padding: 6px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .presence-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        font-size: 13px;
      }
      .presence-row:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .presence-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .presence-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .presence-you {
        margin-left: auto;
        color: var(--text-faint);
        font-size: 11px;
      }

      /* --- Character select --- */
      .back-link {
        position: absolute;
        top: 22px;
        left: 26px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: none;
        border: none;
        color: var(--accent-2);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .back-link:hover {
        color: #a9c4ff;
      }
      .char-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        max-width: 780px;
        margin: 0 auto;
      }
      .char-card {
        width: 122px;
        background: var(--panel);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 8px;
        cursor: pointer;
        color: inherit;
        font: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-sm);
        transition: transform 0.16s ease, border-color 0.16s, box-shadow 0.16s, background 0.16s;
        animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .char-card:nth-child(2) { animation-delay: 0.03s; }
      .char-card:nth-child(3) { animation-delay: 0.06s; }
      .char-card:nth-child(4) { animation-delay: 0.09s; }
      .char-card:nth-child(5) { animation-delay: 0.12s; }
      .char-card:nth-child(6) { animation-delay: 0.15s; }
      .char-card:nth-child(7) { animation-delay: 0.18s; }
      .char-card:nth-child(8) { animation-delay: 0.21s; }
      .char-card:nth-child(9) { animation-delay: 0.24s; }
      .char-card:nth-child(10) { animation-delay: 0.27s; }
      .char-card:hover {
        background: var(--panel-hi);
        border-color: var(--border-hi);
        transform: translateY(-4px);
        box-shadow: var(--shadow);
      }
      .char-card.selected {
        border-color: var(--good);
        background: #21362a;
        box-shadow: 0 0 0 3px rgba(92, 196, 106, 0.22), var(--shadow-sm);
      }
      .char-preview {
        width: 72px;
        height: 108px;
        image-rendering: pixelated;
      }
      .char-actions {
        display: flex;
        justify-content: center;
        margin-top: 36px;
      }
      .start-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
        border: none;
        border-radius: var(--pill);
        color: #ffffff;
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        padding: 13px 42px;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(76, 125, 255, 0.4);
        transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      }
      .start-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 9px 24px rgba(76, 125, 255, 0.5);
      }
      .start-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* --- Debug overlay --- */
      .debug-overlay {
        position: absolute;
        top: 58px;
        left: 18px;
        z-index: 20;
        background: rgba(0, 0, 0, 0.62);
        color: var(--good);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        padding: 5px 10px;
        border-radius: 8px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
