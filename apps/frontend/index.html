<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Workspace</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #151a26;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }

      /* --- Map select menu --- */
      .menu-screen {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 64px 24px;
        text-align: center;
      }
      .menu-screen h1 {
        color: #ffffff;
        font-size: 34px;
        margin: 0 0 12px;
      }
      .menu-subheading {
        color: #8fa0c5;
        font-size: 15px;
        margin: 0 0 48px;
      }
      .menu-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        justify-content: center;
        max-width: 1000px;
        margin: 0 auto;
      }
      .menu-card {
        width: 218px;
        background: #222a3c;
        border: 2px solid #39445e;
        border-radius: 8px;
        padding: 16px;
        cursor: pointer;
        color: inherit;
        font: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: background 0.15s, border-color 0.15s;
      }
      .menu-card:hover {
        background: #2a3450;
        border-color: #7aa2ff;
      }
      .menu-preview {
        width: 100%;
        height: 126px;
        object-fit: cover;
        image-rendering: pixelated;
        border-radius: 4px;
        margin-bottom: 14px;
      }
      .menu-card-title {
        color: #ffffff;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .menu-card-desc {
        color: #9fb0d0;
        font-size: 12px;
        margin-bottom: 14px;
        min-height: 32px;
      }
      .menu-card-cta {
        color: #7aa2ff;
        font-size: 13px;
      }

      /* --- HUD overlay --- */
      .hud-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .hud-title {
        position: absolute;
        top: 14px;
        left: 16px;
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 0 0 4px #000, 0 0 4px #000;
      }
      .hud-hint {
        position: absolute;
        bottom: 14px;
        left: 16px;
        color: #ffffff;
        font-size: 13px;
        text-shadow: 0 0 4px #000, 0 0 4px #000;
      }
      .hud-exit {
        position: absolute;
        top: 12px;
        right: 16px;
        pointer-events: auto;
        background: rgba(34, 42, 60, 0.92);
        border: 2px solid #39445e;
        border-radius: 6px;
        color: #ff8a80;
        font-size: 15px;
        font-weight: bold;
        font-family: inherit;
        padding: 8px 16px;
        cursor: pointer;
      }
      .hud-exit:hover {
        background: #2a3450;
        border-color: #ff8a80;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
