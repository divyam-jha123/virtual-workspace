# Local infra for development.
# Phase 1 introduces the first database (Prisma + PostgreSQL). Redis and a
# self-hosted LiveKit SFU are intentionally NOT here — LiveKit Cloud carries the
# real-time layer, and Redis doesn't enter until Phase 3+ (see CLAUDE.md).
services:
  postgres:
    image: postgres:16
    container_name: vw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtual_workspace
    ports:
      - '5432:5432'
    volumes:
      - vw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d virtual_workspace']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vw-postgres-data:
